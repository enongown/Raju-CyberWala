<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TribeLens</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#f2f2f2; --muted:#9aa0aa; --accent:#e0a526; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:440px; text-align:center;
          box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:.5px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label.drop { display:block; border:2px dashed #3a3f4a; border-radius:12px; padding:22px; cursor:pointer; color:var(--muted); }
  label.drop:hover { border-color:var(--accent); color:var(--text); }
  input[type=file] { display:none; }
  #preview { max-width:100%; max-height:300px; border-radius:12px; margin-top:16px; display:none; }
  #result { margin-top:18px; font-size:26px; font-weight:700; color:var(--accent); min-height:34px; }
  #status { color:var(--muted); font-size:13px; margin-top:6px; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>TribeLens</h1>
    <p class="sub">Upload a photo of traditional attire to identify the tribe.</p>
    <label class="drop" for="file">Tap to choose an image</label>
    <input id="file" type="file" accept="image/*" />
    <img id="preview" alt="Selected image preview" />
    <div id="result"></div>
    <div id="status">Loading model...</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
